[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://quickbay.vercel.app"
additional_redirect_urls = ["https://quickbay.vercel.app/**", "http://localhost:3000/**"]
[auth.email]
enable_signup = true
