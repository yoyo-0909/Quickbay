<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">QuickBay — Every bay. Every job. One platform.</title>
  <desc id="desc">A dark, geometric QuickBay banner with a custom service-bay mark and route-inspired linework.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0b"/>
      <stop offset="1" stop-color="#171b1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3ff5f"/>
      <stop offset="1" stop-color="#d4ff9b"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="440" rx="28" fill="url(#grid)"/>
  <path d="M870 0H1440V440H1030C1110 335 1120 255 1040 180S900 90 870 0Z" fill="#a3ff5f" opacity=".045"/>
