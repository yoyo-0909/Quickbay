  <text x="112" y="390" fill="#7e8984" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3">WORKSHOP DISCOVERY  /  SERVICE OPERATIONS  /  CONNECTED WORKFLOWS</text>
