    <path d="M33 66V54M55 66V54" stroke="#101510" stroke-width="7" stroke-linecap="square"/>
  </g>
  <text x="112" y="276" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="-4">QUICKBAY</text>
  <rect x="115" y="301" width="74" height="5" rx="2.5" fill="url(#accent)"/>
