    <path d="M970 440C1010 350 1000 285 1070 220S1240 150 1440 185"/>
    <path d="M1040 440C1080 360 1080 300 1140 255S1290 195 1440 220"/>
    <path d="M1120 440C1160 375 1165 330 1215 290S1340 250 1440 265"/>
