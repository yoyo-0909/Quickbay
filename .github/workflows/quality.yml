name: Source quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check browser configuration
        run: node --check config.js

      - name: Check workshop importer
        run: node --check scripts/import-workshops.mjs

      - name: Check OpenStreetMap collector
        run: python -m py_compile scripts/fetch_osm_workshops.py
